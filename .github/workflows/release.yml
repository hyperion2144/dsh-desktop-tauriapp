name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全量历史：结构化 release notes 需要上一个 tag..HEAD
          # mobile/dsh-mobile-nav 是 git 子模块（mexiaosqwq/dsh-web-mobile），
          # build.rs 会在打包场景读取子模块内的 package.json/cordis.patch.yml/lib，
          # 不递归 checkout 时该目录为空，CI 构建会失败。
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      # 自动生成结构化 release notes：按提交类型归类，区间为上一个 v* tag..HEAD。
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "${{ github.ref_name }}" | sed -n '1p' || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          : > /tmp/body.md
          echo "## 本次更新（$RANGE）" >> /tmp/body.md
          emit() {
            local header="$1" pat="$2" inv="$3" lines
            if [ "$inv" = 1 ]; then
              lines=$(git log --no-merges --pretty=%s "$RANGE" | grep -vE "$pat" || true)
            else
              lines=$(git log --no-merges --pretty=%s "$RANGE" | grep -iE "$pat" || true)
            fi
            [ -z "$lines" ] && return 0
            echo "" >> /tmp/body.md
            echo "### $header" >> /tmp/body.md
            while IFS= read -r l; do echo "- $l" >> /tmp/body.md; done <<< "$lines"
          }
          emit "🆕 新增" "^feat" 0
          emit "🐛 修复" "^fix" 0
          emit "⚡ 性能" "^perf" 0
          emit "♻️ 重构 / 优化" "^(refactor|style)" 0
          emit "🔧 工程 / CI / 文档" "^(ci|docs|chore|build|test)" 0
          emit "📝 其他修改" "^(feat|fix|perf|refactor|style|ci|docs|chore|build|test)" 1
          echo "" >> /tmp/body.md
          echo "---" >> /tmp/body.md
          echo "- **macOS** (Apple Silicon): .app + .dmg" >> /tmp/body.md
          echo "- **Windows** (x86_64): .msi (WiX) + -setup.exe (NSIS)" >> /tmp/body.md
          echo "- **Android**: app-debug.apk（手机壳，直接安装）" >> /tmp/body.md
          echo "- **iOS**: DeepSeek.ipa（未签名，AltStore 等免费签名侧载）" >> /tmp/body.md
          echo "- **鸿蒙**: 不随 CI 发布，需本地 DevEco 构建（见 mobile/harmony/README.md）" >> /tmp/body.md
          echo "body<<__EOF__" >> "$GITHUB_OUTPUT"
          cat /tmp/body.md >> "$GITHUB_OUTPUT"
          echo "__EOF__" >> "$GITHUB_OUTPUT"
      - name: Build & upload to release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "DeepSeek Harness Desktop ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
      # 修复 release body 乱码：不把多行 body 经 releaseBody/${{ }} 传给 tauri-action
      #（UTF-8 多字节在表达式内嵌 + 双平台并行竞态下会损坏成 U+FFFD，见 v0.5.5/v0.6.1/v0.6.2）。
      # 构建完成后用 gh 直接覆写正确 body（幂等：两个 job 内容相同，最后写入的即正确值）。
      # shell 必须显式 bash：windows-latest 默认 PowerShell，反斜杠续行 `\`
      # 在 PS 里是转义符，`--repo` 会被解析成 unary operator 报
      # "Missing expression after unary operator '--'"（v0.6.3 实测）。
      - name: Overwrite release body (gh)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file /tmp/body.md

  # 移动端壳（expo-app）：Android APK（debug 签名，可直接安装）
  # + iOS IPA（未签名，供 AltStore 等免费签名工具侧载）。
  # 鸿蒙壳不在 CI 发布（需 DevEco/华为签名），见 mobile/harmony/README.md。
  build-mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: android
          - platform: macos-latest
            target: ios

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # expo-app 是 npm 项目（package-lock.json），缓存用 npm 而非 pnpm——
          # pnpm 缓存要找 pnpm-lock.yaml，路径不存在会让 Post 步骤报错
          # "Path Validation Error ... no cache is being saved"（v0.6.4 实测）。
          cache: npm
          cache-dependency-path: mobile/expo-app/package-lock.json

      - name: Setup Java (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (Android)
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Install expo dependencies
        working-directory: mobile/expo-app
        run: npm ci

      - name: Expo prebuild (${{ matrix.target }})
        working-directory: mobile/expo-app
        run: npx expo prebuild -p ${{ matrix.target }} --no-install

      - name: Build Android APK
        if: matrix.target == 'android'
        working-directory: mobile/expo-app/android
        run: ./gradlew assembleDebug

      - name: Build iOS IPA (unsigned)
        if: matrix.target == 'ios'
        working-directory: mobile/expo-app/ios
        run: |
          # macos runner 自带 CocoaPods；确认可用
          pod --version
          pod install
          xcodebuild -workspace DeepSeek.xcworkspace \
            -scheme DeepSeek \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p /tmp/Payload
          cp -R build-device/Build/Products/Release-iphoneos/DeepSeek.app /tmp/Payload/
          cd /tmp && zip -qry DeepSeek.ipa Payload

      - name: Upload Android APK
        if: matrix.target == 'android'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: mobile/expo-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload iOS IPA
        if: matrix.target == 'ios'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: /tmp/DeepSeek.ipa
