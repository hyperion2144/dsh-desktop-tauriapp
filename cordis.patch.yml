# dsh-desktop-tauriapp bundle layer：安装时自动挂载插件行（提供「DSH 桌面壳」技能）。
# 后置层（profile 自身 cordis.patch.yml、--patch 覆盖）可按 id 覆写本行。
# connection scope 补丁：DSH 0.1.5 Web profile 的 connection 条目缺少
# webRuntime/webServer 注入，rpc.handle 注册的 channel 不会挂 HTTP 路由（浏览器侧报
# transport failure）。与 dsh-mnemon 的 cordis.patch.yml 同一手法。
- id: connection
  inject: [webRuntime, webServer]
- insert:
    - id: dsh-desktop-tauriapp
      name: dsh-desktop-tauriapp
