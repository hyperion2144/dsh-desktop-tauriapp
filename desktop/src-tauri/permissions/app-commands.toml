[[permission]]
identifier = "allow-open-external"
description = "允许在外链点击/导航守卫中通过系统默认浏览器/应用打开 http/https/mailto/tel（桌面壳）"
commands = { allow = ["open_external"] }

[[permission]]
identifier = "allow-log-diag"
description = "允许桌面 client 把诊断信息写入应用日志"
commands = { allow = ["log_diag"] }
[[permission]]
identifier = "allow-get-desktop-client-environment"
description = "允许桌面 client 经 IPC 查询壳的渲染环境（模式/平台，替代 URL 标记）"
commands = { allow = ["get_desktop_client_environment"] }

[[permission]]
identifier = "allow-log-console"
description = "允许 WebView initialization_script 把 console.* 写入 ~/.dsh/dsh-desktop-webview.log"
commands = { allow = ["log_console"] }

[[permission]]
identifier = "allow-choose-desktop-mode"
description = "允许加载页切换兼容/高级接入模式"
commands = { allow = ["choose_desktop_mode"] }

[[permission]]
identifier = "allow-get-mode-prompt-needed"
description = "允许加载页轮询模式选择提示状态"
commands = { allow = ["get_mode_prompt_needed"] }

[[permission]]
identifier = "allow-pet-show-main"
description = "允许桌宠唤起主窗口"
commands = { allow = ["pet_show_main"] }

[[permission]]
identifier = "allow-pet-hide"
description = "允许隐藏桌宠窗口"
commands = { allow = ["pet_hide"] }

[[permission]]
identifier = "allow-pet-quit"
description = "允许桌宠触发退出应用"
commands = { allow = ["pet_quit"] }

[[permission]]
identifier = "allow-pet-toggle-passthrough"
description = "允许桌宠切换鼠标穿透"
commands = { allow = ["pet_toggle_passthrough"] }

[[permission]]
identifier = "allow-toggle-zoom"
description = "允许切换缩放"
commands = { allow = ["toggle_zoom"] }

[[permission]]
identifier = "allow-get-dsh-status"
description = "允许查询 dsh 服务状态（侧边栏状态标识）"
commands = { allow = ["get_dsh_status"] }

[[permission]]
identifier = "allow-restart-dsh-service"
description = "允许请求重启 dsh 服务（状态标识点击）"
commands = { allow = ["restart_dsh_service"] }

[[permission]]
identifier = "allow-ui-input-confirm"
description = "允许输入弹窗回填（新建 profile/新增远程/设置端口）"
commands = { allow = ["ui_input_confirm"] }

[[permission]]
identifier = "allow-get-proxy-settings"
description = "允许查询代理设置与当前生效预览（设置表单回显）"
commands = { allow = ["get_proxy_settings"] }

[[permission]]
identifier = "allow-save-proxy-settings"
description = "允许保存代理设置（托盘代理设置表单提交）"
commands = { allow = ["save_proxy_settings"] }

[[permission]]
identifier = "allow-test-proxy-connectivity"
description = "允许对代理地址做 TCP 连通性测试（设置表单测试按钮）"
 commands = { allow = ["test_proxy_connectivity"] }

[[permission]]
identifier = "allow-list-quarantine"
description = "允许读取插件保险丝隔离名单"
commands = { allow = ["list_quarantine"] }

[[permission]]
identifier = "allow-restore-quarantine"
description = "允许恢复被隔离插件（写 patch 托管区块与台账，重启生效）"
commands = { allow = ["restore_quarantine"] }

[[permission]]
identifier = "allow-repair-plugin"
description = "允许触发插件修复（dsh plugin add 重装）"
commands = { allow = ["repair_plugin"] }

[[permission]]
identifier = "allow-run-doctor"
description = "允许运行插件保险丝环境体检"
commands = { allow = ["run_doctor"] }

[[permission]]
identifier = "allow-explain-failure"
description = "允许 AI 解读隔离记录（复用 dsh 凭据）"
commands = { allow = ["explain_failure"] }

[[permission]]
identifier = "allow-get-fuse-summary"
description = "允许读取最近一次启动的隔离事件摘要"
commands = { allow = ["get_fuse_summary"] }

[[permission]]
identifier = "allow-get-quarantine-settings"
description = "允许读取保险丝设置（第一方保护/排除名单/重试次数）"
commands = { allow = ["get_quarantine_settings"] }

[[permission]]
identifier = "allow-save-quarantine-settings"
description = "允许保存保险丝设置"
commands = { allow = ["save_quarantine_settings"] }

[[permission]]
identifier = "allow-list-ai-providers"
description = "允许列出 .credentials.yaml refs 中可用的 AI provider（密钥键名，不含值）"
commands = { allow = ["list_ai_providers"] }

[[permission]]
identifier = "allow-get-desktop-settings-data"
description = "桌面设置面板：get_desktop_settings_data"
commands = { allow = ["get_desktop_settings_data"] }

[[permission]]
identifier = "allow-add-remote-address"
description = "桌面设置面板：add_remote_address"
commands = { allow = ["add_remote_address"] }

[[permission]]
identifier = "allow-remove-remote-address"
description = "桌面设置面板：remove_remote_address"
commands = { allow = ["remove_remote_address"] }

[[permission]]
identifier = "allow-select-remote-address"
description = "桌面设置面板：select_remote_address"
commands = { allow = ["select_remote_address"] }

[[permission]]
identifier = "allow-set-local-port"
description = "桌面设置面板：set_local_port"
commands = { allow = ["set_local_port"] }

[[permission]]
identifier = "allow-switch-profile-command"
description = "桌面设置面板：switch_profile_command"
commands = { allow = ["switch_profile_command"] }

[[permission]]
identifier = "allow-confirm-startup-profile"
description = "启动时用户选择 profile（存量安装 + active_profile 未设）"
commands = { allow = ["confirm_startup_profile"] }


[[permission]]
identifier = "allow-check-startup-needed"
description = "启动检查：前端加载后调用，返回是否需要 profile 选择或完整性修复"
commands = { allow = ["check_startup_needed"] }


[[permission]]
identifier = "allow-get-pending-active-profile"
description = "dsh 启动后取回启动时选择的 profile，前端通过 nsSave 持久化"
commands = { allow = ["get_pending_active_profile"] }
[[permission]]
identifier = "allow-migrate-profile"
description = "桌面设置面板：migrate_profile（#88 profile 迁移）"
commands = { allow = ["migrate_profile"] }

[[permission]]
identifier = "allow-migration-status"
description = "桌面设置面板：migration_status（#90 迁移进度条）"
commands = { allow = ["migration_status"] }

[[permission]]
identifier = "allow-task-status"
description = "桌面设置面板：通用长任务状态轮询（#95 拒绝静默：新建/迁移任务卡）"
commands = { allow = ["task_status"] }

[[permission]]
identifier = "allow-list-runtime-catalog"
description = "桌面设置面板：运行时版本目录/已装列表（#95）"
commands = { allow = ["list_runtime_catalog"] }

[[permission]]
identifier = "allow-download-runtime"
description = "桌面设置面板：下载并安装 dsh 运行时（#95）"
commands = { allow = ["download_runtime"] }

[[permission]]
identifier = "allow-remove-runtime"
description = "桌面设置面板：删除已下载的 dsh 运行时（#95）"
commands = { allow = ["remove_runtime"] }

[[permission]]
identifier = "allow-runtime-download-status"
description = "桌面设置面板：运行时下载进度轮询（remote 页 event 不可用，#95）"
commands = { allow = ["runtime_download_status"] }
# ── 下载管理器（#72）：右侧边栏下载 tab / blob 拦截 / 桌面设置并发项 ──

[[permission]]
identifier = "allow-list-downloads"
description = "下载管理器：读取任务列表快照"
commands = { allow = ["list_downloads"] }

[[permission]]
identifier = "allow-get-dsh-source"
description = "桌面设置面板：get_dsh_source（#90）"
commands = { allow = ["get_dsh_source"] }

[[permission]]
identifier = "allow-set-dsh-source"
description = "桌面设置面板：set_dsh_source（#90）"
commands = { allow = ["set_dsh_source"] }

[[permission]]
identifier = "allow-list-profile-ports"
description = "桌面设置面板：list_profile_ports（#90）"
commands = { allow = ["list_profile_ports"] }

[[permission]]
identifier = "allow-set-profile-port"
description = "桌面设置面板：set_profile_port（#90）"
commands = { allow = ["set_profile_port"] }

[[permission]]
identifier = "allow-create-profile-flow-command"
description = "桌面设置面板：create_profile_flow_command（#90）"
commands = { allow = ["create_profile_flow_command"] }

[[permission]]
identifier = "allow-pause-download"
description = "下载管理器：暂停任务（.part 保留可续传）"
commands = { allow = ["pause_download"] }

[[permission]]
identifier = "allow-resume-download"
description = "下载管理器：恢复任务（Range 续传优先）"
commands = { allow = ["resume_download"] }

[[permission]]
identifier = "allow-cancel-download"
description = "下载管理器：取消任务并清理临时文件"
commands = { allow = ["cancel_download"] }

[[permission]]
identifier = "allow-clear-finished-downloads"
description = "下载管理器：清空已完成任务记录"
commands = { allow = ["clear_finished_downloads"] }

[[permission]]
identifier = "allow-get-download-settings"
description = "下载管理器：读取并发上限设置"
commands = { allow = ['get_download_settings'] }

[[permission]]
identifier = 'allow-set-download-concurrency'
description = '下载管理器：调整并发上限（写 settings.yaml）'
commands = { allow = ['set_download_concurrency'] }

[[permission]]
identifier = 'allow-reveal-download'
description = '下载管理器：在系统文件管理器中显示已完成文件'
commands = { allow = ['reveal_download'] }

[[permission]]
identifier = 'allow-start-blob-download'
description = '下载管理器：blob 下载开始（弹保存框，返回任务 id）'
commands = { allow = ['start_blob_download'] }

[[permission]]
identifier = 'allow-save-blob-chunk'
description = '下载管理器：blob 分块写入（base64）'
commands = { allow = ['save_blob_chunk'] }

[[permission]]
identifier = 'allow-finish-blob-download'
description = '下载管理器：blob 分块结束（落盘+通知）'
commands = { allow = ['finish_blob_download'] }
